<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="author" content="Sonia Fernández"/>
        <title>Tipos de listas en HTML</title>
        <meta name="description" content="crearemos una serie de listas desordenadas">
        <meta name="keywords" content="Lenguaje de marcas, html, actividad 10">
    </head>
    
    <body>
        <h1>Listas no ordenadas</h1>
        <ul type="disc">
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
            <li>Elemento 4</li>
        </ul>
        <ul type="circle">
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
            <li>Elemento 4</li>
        </ul>
        <ul type="square">
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
            <li>Elemento 4</li>
        </ul>

    </body>
