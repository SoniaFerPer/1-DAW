<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="author" content="Sonia Fernández"/>
        <title>Tipos de listas en HTML</title>
        <meta name="description" content="crearemos una serie de listas ordenadas">
        <meta name="keywords" content="Lenguaje de marcas, html, actividad 10">
    </head>
    
    <body>
        <h1>Listas ordenadas</h1>
        <ol type="a" start="4">
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
            <li>Elemento 4</li>
        </ol>
        <ol type="1" start="100" reversed>
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
            <li>Elemento 4</li>
        </ol>
        <ol type="i" start="999">
            <li>Elemento 1</li>
            <li>Elemento 2</li>
            <li>Elemento 3</li>
            <li>Elemento 4</li>
        </ol>

    </body>
