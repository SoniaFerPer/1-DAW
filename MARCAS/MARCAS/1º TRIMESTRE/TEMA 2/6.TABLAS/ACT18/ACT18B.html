<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="author" content="Sonia Fernández"/>
        <title>Ejemplo de tabla básica</title>
        <meta name="description" content="Ejercicios de tablas en html">
        <meta name="keywords" content="html,ejercicio 18,tablas,html,oretania,marcas">
    </head>
    <body>
    <table border="2" bgcolor="#f2f2f2" cellspacing="3" cellpadding="30" rules="all" >
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>D</td>
        </tr>
        <tr>
            <td rowspan="2">E,I</td>
            <td>F</td>
            <td colspan="2" align="left">G,H</td>
        </tr>
        <tr>
            <td>J</td>
            <td rowspan="2">K,O</td>
            <td>L</td>
        </tr>
        <tr>
            <td>M</td>
            <td>N</td>
            <td>P</td>
        </tr>
    </table>
    </body>
</html>
