<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <meta name="author" content="Sonia Fernández"/>
        <title>Ejemplo de tabla básica</title>
        <meta name="description" content="Ejercicios de tablas en html">
        <meta name="keywords" content="html,ejercicio 18,tablas,html,oretania,marcas">
        <style>
            table{
                border-collapse:collapse;
            }
            td{
                border: 1px solid #000;
                padding: 25px;
                background-color:#ccc;
            }
        </style>
    </head>
    <body>
    <table border="1" style="border-collapse: separate" bordercolor="#111111" width="200" >
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>D</td>
        </tr>
        <tr>
            <td rowspan="2">E,I</td>
            <td>F</td>
            <td colspan="2" align="left">G,H</td>
        </tr>
        <tr>
            <td>J</td>
            <td rowspan="2">K,O</td>
            <td>L</td>
        </tr>
        <tr>
            <td>M</td>
            <td>N</td>
            <td>P</td>
        </tr>
    </table>
    </body>
</html>
