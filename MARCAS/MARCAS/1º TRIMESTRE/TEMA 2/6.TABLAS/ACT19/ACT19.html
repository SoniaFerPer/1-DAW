<!DOCTYPE html>

        <title>Ejercicio tablas con estilos html</title>
        <meta name="description" content="Ejercicios de tablas en html">
        <meta name="keywords" content="html,ejercicio 19,tablas,html,oretania,marcas">
        <style>
            table{
                border-collapse:collapse;
                caption-side: bottom;
            }
            caption{
                font-weight: bold;
                margin-top: 16px;
            }
            th,td{padding:5px 10px;}
            td,th{border:1px solid #1c1c1c; text-align:center;} 
        </style>
    </head>
    <body>
    <table>
        <caption>Este es el caption de la tabla</caption>
        <tr>
            <th>Ciudad</th>

        </tr>
        <tr>

        <tr>

        <tr>

</html>
